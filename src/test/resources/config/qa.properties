# QA environment configuration.
#
# Any value here can be overridden without editing this file, which is what lets the same
# properties file be used from a laptop and from a CI/CD pipeline:
#   mvn test -Denv=qa -Dbooker.base.url=https://restful-booker.herokuapp.com
#   BOOKER_BASE_URL=https://restful-booker.herokuapp.com mvn test
#
# Credentials are stored encrypted as ENC(...) (see CredentialCipher) and decrypted at run time
# using the passphrase supplied via -DencryptionKey=... or the ENCRYPTION_KEY env var. A CI/CD
# pipeline may instead inject booker.auth.username / booker.auth.password directly as plain
# -D values pulled from its own secret store; CredentialManager uses such values as-is.

reqres.base.url=https://reqres.in/api
booker.base.url=https://restful-booker.herokuapp.com
jsonplaceholder.base.url=https://jsonplaceholder.typicode.com

# ReqRes caps anonymous (keyless) requests at 40/day per IP, which this suite's own ReqRes
# tests can consume in a single run. Sign up for a free key at https://app.reqres.in (250
# requests/day) and set it here, or override per-run without editing this file:
#   mvn test -Dreqres.api.key=your_key_here
# reqres.api.key=

# Restful-Booker demo credentials (publicly documented test account for this sandbox API),
# encrypted with the default local-dev passphrase. Regenerate with CredentialCipher if you
# change the passphrase - see README.md.
booker.auth.username=ENC(rTZtycka27+5MSLPnXJvTPj4o/+alTRZMoeoQ5gX0fj5W6Pso49cAyMbmag2A0Ffyw==)
booker.auth.password=ENC(60Q2iEslZz1BOZvTVysbk20srvX8UQI7D5DPegyoP8Nw1Cm/8/KRorzUnbK+wtscgDbjHYfvmg==)

# HTTP client behaviour. Read timeout is generous because the public sandboxes this suite targets
# are free-tier instances (e.g. Heroku) that occasionally respond slowly; http.retry.max.attempts
# absorbs any remaining transient network blips.
http.connection.timeout.ms=10000
http.read.timeout.ms=20000
http.retry.max.attempts=2

# Report metadata - surfaced in the Extent report's system-info panel (see ExtentManager) and
# usable anywhere else ConfigManager is read from.
report.author=Midhat Rosull Chughtai
report.author.email=m4midhat@gmail.com
report.author.github=github.com/m4midhat
report.purpose=API Test cases reporting

# ExtentReports output. Overridable the same way as everything else, e.g.
#   mvn test -Dextent.report.path=target/extent-report/CustomName.html
extent.report.path=target/extent-report/ExtentReport.html
extent.report.title=REST API Automation Report
extent.report.name=API Test Execution Report
extent.report.theme=standard
